services:
  api:
    image: ghcr.io/${GITHUB_OWNER:?Falta GITHUB_OWNER en .env}/my-monorepo-api:latest
    container_name: monorepo_api
    restart: always
    ports:
      - "127.0.0.1:3091:3091"
    environment:
      - PORT=3091
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?Falta DATABASE_URL en .env}
    networks:
      - app-network
      - db_prod

  web:
    image: ghcr.io/${GITHUB_OWNER:?Falta GITHUB_OWNER en .env}/my-monorepo-web:latest
    container_name: monorepo_web
    restart: always
    ports:
      - "127.0.0.1:3092:80"
    # se omite VITE_API_URL, porque: Vite la incrusta al compilar, y eso ya lo resuelve el build-args del workflow con vars.API_URL_PROD
    #environment:
    #  - VITE_API_URL=https://api-exa.midominio.net      
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  db_prod:
    external: true
    name: db_prod
